[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countit"
version = "0.1.0"
description = "Local-only aggregate typing telemetry for X11"
requires-python = ">=3.11"
dependencies = ["python-xlib>=0.33"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
countit = "countit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
