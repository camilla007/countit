name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest
      - name: Build wheel from source distribution
        run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py
      - name: Test the installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/countit-wheel"
          "$RUNNER_TEMP/countit-wheel/bin/python" -m pip install dist/*.whl pytest
          "$RUNNER_TEMP/countit-wheel/bin/python" -m pytest
          "$RUNNER_TEMP/countit-wheel/bin/countit" --version
          "$RUNNER_TEMP/countit-wheel/bin/countit" --help
          "$RUNNER_TEMP/countit-wheel/bin/countit" service-template
      - name: Save validated distributions
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
